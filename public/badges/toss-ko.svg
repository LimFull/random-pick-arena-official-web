<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" role="img" aria-label="토스에서 바로 하기">
  <rect width="240" height="80" rx="14" fill="#000"></rect>
  <!-- 토스 공식 앱 아이콘 (brand.toss.im 브랜드 리소스, 원본 그대로 축소) -->
  <clipPath id="toss-icon"><rect x="18" y="18" width="44" height="44" rx="10"></rect></clipPath>
  <image x="18" y="18" width="44" height="44" clip-path="url(#toss-icon)" href="data:image/png;base64,"></image>
  <g transform="translate(74 16)" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, &#39;Apple SD Gothic Neo&#39;, &#39;Pretendard&#39;, sans-serif">
    <text x="0" y="18" font-size="13" font-weight="500" letter-spacing="-0.2">설치 없이 바로</text>
    <text x="0" y="44" font-size="22" font-weight="700" letter-spacing="-0.5">토스에서 하기</text>
  </g>
</svg>
